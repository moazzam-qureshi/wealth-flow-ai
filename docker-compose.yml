# WealthFlow AI — single flat compose. Deployed via Coolify on a self-hosted VPS:
# Coolify/Traefik own ingress + TLS + routing, so there are NO custom networks,
# NO published ports, and NO reverse-proxy config here. Only `app` is web-facing
# (Coolify detects it from the EXPOSE in ui/Dockerfile and wires Traefik to it).
#
# Locally: `cp .env.example .env && docker compose -f docker-compose.yml -f docker-compose.local.yml up --build`
#   app  → http://localhost:3000   (the override file publishes the ports)

services:
  app:
    build:
      context: ./ui
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    # Web-facing service. No published `ports:` — Coolify/Traefik route to :3000
    # (it's the EXPOSE in ui/Dockerfile). Local port publishing is in docker-compose.local.yml.
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-wealthflow}:${POSTGRES_PASSWORD:-wealthflow}@postgres:5432/${POSTGRES_DB:-wealthflow}
      SEAWEEDFS_S3_ENDPOINT: http://seaweedfs:8333
      # Must match an identity in seaweedfs/s3.json (the `wealthflow` identity).
      SEAWEEDFS_S3_ACCESS_KEY: ${SEAWEEDFS_S3_ACCESS_KEY:-wealthflow}
      SEAWEEDFS_S3_SECRET_KEY: ${SEAWEEDFS_S3_SECRET_KEY:-wealthflowsecret}
      # Container has IPv4-only egress; DNS returns AAAA records too. Disabling
      # Happy-Eyeballs makes Node connect IPv4-first sequentially instead of racing
      # (and timing out) on the dead IPv6 addresses — fixes ETIMEDOUT to OpenRouter.
      NODE_OPTIONS: "--no-network-family-autoselection --dns-result-order=ipv4first"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/login',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wealthflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wealthflow}
      POSTGRES_DB: ${POSTGRES_DB:-wealthflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wealthflow} -d ${POSTGRES_DB:-wealthflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    # Single-binary mode: master + volume + filer + S3 gateway on :8333, with an
    # S3 identity config (this image enforces credentials even with `-s3` alone, so
    # the app's SEAWEEDFS_S3_ACCESS_KEY/SECRET_KEY must match an identity in s3.json).
    # The config is delivered as a compose `config` (see the top-level `configs:`
    # block), NOT a bind mount — under Coolify a relative single-file bind mount
    # resolves to a missing host path and Docker auto-creates an empty *directory*
    # there ("is a directory" crash). Configs sidestep that.
    command: server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -dir=/data
    volumes:
      - seaweeddata:/data
    configs:
      - source: seaweedfs_s3
        target: /etc/seaweedfs/s3.json
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

configs:
  seaweedfs_s3:
    file: ./seaweedfs/s3.json

volumes:
  pgdata:
  seaweeddata:
